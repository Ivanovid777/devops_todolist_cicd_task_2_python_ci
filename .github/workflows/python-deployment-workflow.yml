name: python-deployment-workflow
run-name: '${{github.actor}} - ${{github.sha}}'
env:
  PYTHON_VERSION: "3.9"
on:
  push:
    branches: 
    - main
    - develop

jobs:
  
  python-ci:
    defaults:
      run:
        working-directory: ./src
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: acttions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{env.PYTHON_VERSION}}
      
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r /requirements.txt 

      - name: Unit tests
        run: |
          coverage run manage.py test
          coverage report
          
      - name: Coverage report
        run: |
          coverage report

      - name: Check code style with flake8
        run: |
          flake8 . --exit-zero --statistics

      - name: Check complexity with flake8
        run: |
          flake8 . --exit-zero --max-complexity=10 

      - name: Upload Python code
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-source-code

    
